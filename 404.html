<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Nexus</title><link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<script>
  /* GitHub Pages : une adresse inconnue renvoie vers l'application (routes en #/…). */
  (function () { var b = location.pathname.split('/').filter(Boolean); var root = b.length && b[0].toLowerCase() === 'nexus' ? '/' + b[0] + '/' : '/'; location.replace(root + '#/accueil'); })();
</script></head><body><p><a href="./">Ouvrir Nexus</a></p></body></html>
